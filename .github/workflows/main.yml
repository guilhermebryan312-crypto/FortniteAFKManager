
name: Build Fortnite AFK Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        run: |
          mkdir -p source
          unzip -q FortniteAFKManager-Android-Starter.zip -d source
          test -f source/FortniteAFKManager/settings.gradle.kts

      - name: Corrigir compatibilidade Java 17
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/FortniteAFKManager/app/build.gradle.kts")
          s = p.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
                  1
              )

          p.write_text(s)
          PY

      - name: Compilar APK
        run: gradle -p source/FortniteAFKManager assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Fortnite-AFK-Manager
          path: source/FortniteAFKManager/app/build/outputs/apk/debug/*.apk
